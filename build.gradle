plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.zawu.chesspvp'
version = mod_version
base.archivesName = "chesspvp-${minecraft_version}-neoforge"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
java.withSourcesJar()

repositories { mavenCentral() }

neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }
    mods { chesspvp { sourceSet sourceSets.main } }
}

dependencies {
    // Development dependency only; Touhou Little Maid is never embedded in this addon.
    implementation files(project.file(maid_jar))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    def props = [minecraft_version_range: minecraft_version_range,
                 neo_version_range: neo_version_range, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
